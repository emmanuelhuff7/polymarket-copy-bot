[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-copy-bot"
version = "0.1.0"
description = "Automated basket copy trading bot for Polymarket"
requires-python = ">=3.11"
authors = [{name = "Copy Bot Contributors"}]

dependencies = [
    "py-clob-client>=0.34.0",
    "web3>=6.10.0",
    "boto3>=1.28.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "eth-account>=0.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.10.0",
    "ruff>=0.13.0",
    "mypy>=1.7.0",
    "localstack>=3.0.0",
]
aws = [
    "aws-cdk-lib>=2.95.0",
    "constructs>=10.3.0",
    "aws-cdk.aws_ecs>=2.95.0",
    "aws-cdk.aws_ec2>=2.95.0",
    "aws-cdk.aws_dynamodb>=2.95.0",
    "aws-cdk.aws_sqs>=2.95.0",
    "aws-cdk.aws_lambda>=2.95.0",
    "aws-cdk.aws_sns>=2.95.0",
    "aws-cdk.aws_events>=2.95.0",
    "aws-cdk.aws_events_targets>=2.95.0",
    "aws-cdk.aws_ecr>=2.95.0",
    "aws-cdk.aws_secretsmanager>=2.95.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
